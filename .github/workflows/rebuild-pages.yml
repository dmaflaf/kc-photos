name: Actualizar la página

# GitHub Pages publica desde la rama main, pero no reconstruye solo cuando
# los cambios llegan desde una app (como Claude). Este paso se lo pide.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a GitHub Pages que publique la última versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
